name: dayfx_signals
description: DayFX Signals — forex day-trading signals with price action and news strategies, tracked results.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  workmanager: ^0.9.0
  flutter_local_notifications: ^19.0.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  in_app_review: ^2.0.9
  google_fonts: ^6.2.1
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#0B0F17"
  adaptive_icon_foreground: assets/icon_foreground.png
